spring.application.name=plottheirfuture_backend
server.port=8085

# ===============================
# DATABASE CONFIGURATION (MySQL)
# Enhanced with JDBC statement caching for high-throughput concurrency
# ===============================
spring.datasource.url=jdbc:mysql://localhost:3306/plottheirfuture_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&cachePrepStmts=true&prepStmtCacheSize=250&prepStmtCacheSqlLimit=2048&useServerPrepStmts=true&rewriteBatchedStatements=true
spring.datasource.username=root
spring.datasource.password=Satya12@
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================
# HIKARICP CONNECTION POOL TUNING
# Prevent connection starvation during concurrent bursts
# ===============================
spring.datasource.hikari.maximum-pool-size=50
spring.datasource.hikari.minimum-idle=20
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000
spring.datasource.hikari.leak-detection-threshold=60000

# ===============================
# EMBEDDED TOMCAT HIGH-CONCURRENCY TUNING
# Handles 100k connection spikes without dropping requests
# ===============================
server.tomcat.threads.max=500
server.tomcat.threads.min-spare=50
server.tomcat.max-connections=20000
server.tomcat.accept-count=5000
server.tomcat.connection-timeout=20000

# ===============================
# JAVA 21 VIRTUAL THREADS (PROJECT LOOM)
# Lightweight threads for massive concurrent throughput
# ===============================
spring.threads.virtual.enabled=true

# ===============================
# JPA / HIBERNATE SETTINGS
# Disabled synchronous stdout logging to eliminate I/O thread contention
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# ===============================
# FLYWAY MIGRATION
# ===============================
spring.flyway.enabled=false
spring.flyway.baseline-on-migrate=true
